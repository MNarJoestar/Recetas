<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#263c32" />
  <title>Recetario personal</title>

  <!-- PWA Manifest e Íconos -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Compatibilidad de pantalla completa para iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <!-- Pantalla Principal -->
    <section id="homeScreen" class="screen home-screen" aria-labelledby="homeTitle">
      <div class="home-content">
        <p class="eyebrow">SABORES DE CASA</p>
        <h1 id="homeTitle">Recetario<br />personal</h1>
        <div class="crossed-utensils">
          <img src="icon-192.png" alt="Cuchara y tenedor cruzados" />
        </div>
        <p class="home-note">Tus recetas favoritas, siempre a mano.</p>
        <button class="button button-primary home-list-button" type="button" data-screen="list">Mis recetas</button>
      </div>
      <button class="add-fab" type="button" data-screen="form" aria-label="Agregar nueva receta">+</button>
    </section>

    <!-- Formulario para Agregar/Editar Receta -->
    <section id="formScreen" class="screen form-screen hidden" aria-labelledby="formHeading">
      <header class="page-header">
        <p class="eyebrow">GUARDAR UN SABOR</p>
        <h2 id="formHeading">Nueva receta</h2>
      </header>
      <form id="recipeForm" class="recipe-form">
        <label for="recipeTitle">Nombre de la receta</label>
        <input id="recipeTitle" name="title" type="text" placeholder="Ej. Lasagna de la abuela" maxlength="100" required />

        <label for="recipeIngredients">Ingredientes y cantidades</label>
        <textarea id="recipeIngredients" name="ingredients" rows="5" placeholder="Ej. 2 tomates, 300 g de harina..." required></textarea>

        <label for="recipeSteps">Paso a paso</label>
        <textarea id="recipeSteps" name="steps" class="steps-input" rows="8" placeholder="Describe cómo preparar la receta..." required></textarea>
        <div class="dictation-controls">
          <label class="dictation-language-label" for="dictationLanguage">Idioma del dictado</label>
          <select id="dictationLanguage" class="dictation-language">
            <option value="es-MX" selected>Español (México)</option>
            <option value="es-VE">Español (Venezuela)</option>
            <option value="pt-BR">Português (Brasil)</option>
          </select>
          <button id="dictationButton" class="button button-edit" type="button">Grabar paso a paso</button>
          <p id="dictationStatus" class="dictation-status" role="status" aria-live="polite">Puedes dictar y luego corregir el texto aquí.</p>
        </div>

        <label class="upload-button" for="recipePhoto">
          <span aria-hidden="true">＋</span> Añadir foto desde el dispositivo
        </label>
        <input id="recipePhoto" name="photo" type="file" accept="image/*" capture="environment" />
        <div id="photoPreview" class="photo-preview hidden"></div>
        <p id="formMessage" class="form-message" role="status"></p>
        <button class="button button-primary save-button" type="submit">Guardar receta</button>
      </form>
      <button class="button button-back fixed-back" type="button" data-screen="home"><span aria-hidden="true">←</span> Inicio</button>
    </section>

    <!-- Lista de Recetas -->
    <section id="listScreen" class="screen list-screen hidden" aria-labelledby="listHeading">
      <header class="page-header">
        <p class="eyebrow">TU COLECCIÓN</p>
        <h2 id="listHeading">Mis recetas</h2>
        <p class="section-description">De la primera que guardaste a la más reciente.</p>
      </header>
      <div id="recipeList" class="recipe-list" aria-live="polite"></div>
      <button class="button button-back fixed-back" type="button" data-screen="home"><span aria-hidden="true">←</span> Inicio</button>
    </section>

    <!-- Detalle de la Receta -->
    <section id="detailScreen" class="screen detail-screen hidden" aria-labelledby="detailTitle">
      <article id="recipeDetail" class="recipe-detail"></article>
      <button class="button button-back fixed-back" type="button" data-screen="list"><span aria-hidden="true">←</span> Mis recetas</button>
    </section>
  </main>

  <script src="script.js"></script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.error('Error al registrar el Service Worker:', err));
      });
    }
  </script>
</body>
</html>
